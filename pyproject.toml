[project]
name = "m5-ts-forecast-demo"
version = "0.1.0"
description = "A small PyTorch and Streamlit retail demand forecasting demo"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "streamlit>=1.40,<2",
    "xgboost-cpu>=2.1,<4; sys_platform == 'linux'",
    "xgboost>=2.1,<4; sys_platform != 'linux'",
]

[project.optional-dependencies]
cpu = ["torch>=2.6,<2.9"]
cuda = ["torch>=2.6,<2.9"]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10", "mkdocstrings[python]>=0.28,<1"]
notebook = ["jupyterlab>=4,<5", "ipykernel>=6,<8", "matplotlib>=3.9,<4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/m5_forecast"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
